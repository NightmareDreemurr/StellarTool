name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Host and Mod
        run: sh build.sh
      - name: Verify built files
        run: |
          set -eu
          for source in web/*.html web/*.css web/*.mjs; do
            cmp "$source" "dist/host/$source"
          done
          git ls-files -z web/assets | xargs -0 -I '{}' cmp '{}' 'dist/host/{}'
          test ! -e dist/host/bridge-token.txt
          test ! -e dist/host/config.json
          test ! -e dist/host/resource-path.txt
          test -f dist/mod/StellarTool.Mod.dll
      - name: Web tests
        run: node --test tests/*.test.mjs
      - name: .NET tests
        run: |
          set -eu
          for suite in StellarTool NativeButtonLeds Settlement Judgement; do
            dotnet run --project "tests/${suite}.Tests" -c Release
          done
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify the Windows launcher and bundled assets
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'StellarTool Web'
          dotnet publish src/StellarTool.Host -c Release -r win-x64 --self-contained true -p:RuntimeFrameworkVersion=8.0.34 --source https://api.nuget.org/v3/index.json -o $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item scripts/Start-StellarTool.cmd $publish
          $fixture = Join-Path $env:RUNNER_TEMP 'jacket fixture'
          New-Item -ItemType Directory (Join-Path $fixture 'assets/jackets') -Force | Out-Null
          $jacket = Join-Path $fixture 'assets/jackets/UI_Jacket_000001.png'
          Copy-Item web/assets/cad-keys-v1/cropped/KEY_01.png $jacket
          Compress-Archive -Path (Join-Path $fixture 'assets') -DestinationPath (Join-Path $publish 'jackets.zip')
          $launcher = Start-Process cmd.exe -ArgumentList '/d', '/c', 'Start-StellarTool.cmd' -WorkingDirectory $publish -PassThru -NoNewWindow
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 40 -and -not $health; $attempt++) {
              if ($launcher.HasExited) { throw 'The launcher exited before the Host became ready' }
              try { $health = Invoke-RestMethod 'http://127.0.0.1:7856/api/health' -TimeoutSec 2 } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $health.ok) { throw 'Host health check failed' }
            $demo = Invoke-WebRequest 'http://127.0.0.1:7857/judgement?preview=true'
            if ($demo.Content -notmatch 'judgement.mjs') { throw 'Judgement demo was not served' }
            $asset = Join-Path $env:RUNNER_TEMP 'stellar-host-test.png'
            Invoke-WebRequest 'http://127.0.0.1:7857/assets/cad-keys-v1/cropped/KEY_01.png' -OutFile $asset
            if ((Get-FileHash $asset).Hash -ne (Get-FileHash web/assets/cad-keys-v1/cropped/KEY_01.png).Hash) {
              throw 'The bundled asset differs from the source'
            }
            $servedJacket = Join-Path $env:RUNNER_TEMP 'stellar-jacket-test.png'
            Invoke-WebRequest 'http://127.0.0.1:7857/assets/jackets/UI_Jacket_000001.png' -OutFile $servedJacket
            if ((Get-FileHash $servedJacket).Hash -ne (Get-FileHash $jacket).Hash) {
              throw 'The launcher did not serve the bundled jacket bytes'
            }
            if (-not (Test-Path (Join-Path $publish 'config.json')) -or -not (Test-Path (Join-Path $publish 'bridge-token.txt'))) {
              throw 'The launcher did not initialize local configuration'
            }
          } finally {
            if (-not $launcher.HasExited) { Stop-Process -Name 'StellarTool.Host' -ErrorAction SilentlyContinue }
          }
